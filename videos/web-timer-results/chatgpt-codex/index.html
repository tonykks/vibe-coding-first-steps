<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 타이머 · 10분</title>
<meta name="description" content="1분, 5분, 10분, 20분을 선택해 수업 화면에 크게 띄워 쓰는 타이머. 시작, 일시정지, 초기화, 전체 화면과 종료 알림음.">
<style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#183c36;background:#f5f6ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:28px 5vw;gap:16px}.brand{font-size:20px;font-weight:800;letter-spacing:-.8px}.brand span{color:#669181;margin-right:9px}button{font:inherit;cursor:pointer;border:1px solid #cad6ca;background:transparent;border-radius:14px;color:inherit;padding:14px 23px;font-weight:700;transition:background .15s,transform .15s}button:hover{background:#e4ebe0}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #d19940;outline-offset:5px}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 5vw 35px;text-align:center}.eyebrow{font-size:14px;letter-spacing:3px;font-weight:700;color:#628174;margin-bottom:18px}.state{display:inline-flex;align-items:center;gap:9px;border:1px solid #d7dfd0;background:#ebefe4;padding:9px 18px;border-radius:30px;font-size:15px}.dot{width:7px;height:7px;background:#6a8d71;border-radius:50%}#time{font-size:clamp(88px,23vw,310px);font-weight:800;line-height:1.16;letter-spacing:-.065em;font-variant-numeric:tabular-nums;padding-right:.065em;margin:20px 0 12px}#time.warn{color:#af651b}#time.urgent,#time.done{color:#d02020}.track{width:min(720px,82vw);height:10px;background:#dfe6d8;border-radius:10px;overflow:hidden}#fill{width:100%;height:100%;background:#4c7760;border-radius:10px;transition:width .2s linear}#message{font-size:18px;color:#668071;min-height:27px;margin:23px 0 31px}.controls{display:flex;gap:12px;justify-content:center}.controls button{min-width:130px;min-height:58px;font-size:18px}.controls #toggle{background:#214f3e;border-color:#214f3e;color:white;min-width:186px}.controls #toggle:hover{background:#163f30}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 5vw;color:#6a7d70;font-size:13px;border-top:1px solid #dce3d6}label{display:flex;align-items:center;gap:9px;cursor:pointer}input{accent-color:#214f3e;width:17px;height:17px}.keys{color:#829082}.keys kbd{font:inherit;border:1px solid #ccd6c8;border-radius:5px;padding:3px 7px;background:#eef1e8}.finish{background:#fcf1e7}body:fullscreen{background:#f5f6ef}body.finish:fullscreen{background:#fcf1e7}@media(max-width:600px){header{padding:20px 6vw}.brand{font-size:18px}header button{font-size:13px;padding:11px 13px}.eyebrow{font-size:12px}main{padding-bottom:30px}#message{font-size:15px}.controls button{min-width:100px;font-size:16px}.controls #toggle{min-width:154px}footer{flex-wrap:wrap;justify-content:center;padding:20px}.keys{display:none}}@media(max-height:600px) and (min-width:600px){header{padding:14px 5vw}.eyebrow{display:none}#time{font-size:30vh;margin:5px 0}#message{margin:12px 0}.controls button{min-height:45px;padding:10px 20px}footer{padding:12px 5vw}}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}.presets button{padding:10px 20px;border-radius:30px;font-size:16px}.presets button[aria-pressed="true"]{color:white;background:#214f3e;border-color:#214f3e}.preset-help{font-size:12px;color:#668071;margin:-10px 0 20px}.sound-controls{display:flex;align-items:center;gap:12px}#test-sound{font-size:12px;padding:7px 10px;border-radius:8px}@media(max-height:600px) and (min-width:600px){.presets{margin-bottom:8px}.presets button{padding:6px 16px}.preset-help{display:none}}
/* 늦가을 배경: 숫자 뒤는 밝게, 잎은 화면 가장자리에 배치 */
body{isolation:isolate;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(250,248,239,.42),rgba(250,248,239,.42)),url("assets/autumn-background.png");background-size:cover;background-position:center;background-repeat:no-repeat}
body:fullscreen,body.finish:fullscreen{background:transparent}
body.finish::before{background-image:linear-gradient(rgba(255,241,229,.48),rgba(255,241,229,.48)),url("assets/autumn-background.png")}
header button,.presets button{background-color:rgba(250,249,241,.84)}
.controls #reset{background-color:rgba(250,249,241,.88)}
footer{background:rgba(250,249,241,.82);color:#4c6658}
.preset-help,.eyebrow,#message{color:#4f6c5c}
@media(max-width:600px){body::before{background-position:50% center}}
</style>
</head>
<body>
<header><div class="brand"><span>◷</span>수업 타이머</div><button id="fullscreen" type="button">⛶ 전체 화면</button></header>
<main>
<div class="eyebrow">지금은 집중할 시간</div>
<div class="presets" role="group" aria-label="타이머 시간 선택"><button type="button" data-minutes="1" aria-pressed="false">1분</button><button type="button" data-minutes="5" aria-pressed="false">5분</button><button type="button" data-minutes="10" aria-pressed="true">10분</button><button type="button" data-minutes="20" aria-pressed="false">20분</button></div>
<p class="preset-help">시간을 선택하면 타이머가 초기화돼요.</p>
<div class="state"><span class="dot" aria-hidden="true"></span><span id="status" role="status">시작할 준비가 됐어요</span></div>
<div id="time" role="timer" aria-label="남은 시간 10분 0초">10:00</div>
<div class="track" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="600" aria-valuenow="600"><div id="fill"></div></div>
<p id="message">준비가 되면 시작 버튼을 눌러 주세요.</p>
<div class="controls"><button id="toggle" type="button">▶ 시작</button><button id="reset" type="button">↺ 초기화</button></div>
</main>
<footer><div class="sound-controls"><label><input id="sound" type="checkbox" checked>종료 알림음</label><button id="test-sound" type="button">소리 확인</button></div><span class="keys"><kbd>Space</kbd> 시작·일시정지 &nbsp; <kbd>R</kbd> 초기화 &nbsp; <kbd>F</kbd> 전체 화면</span><span id="duration-label">10분 · 함께 집중해요</span></footer>
<script>
let DURATION=600000;
let remaining=DURATION,deadline=0,running=false,finished=false,audioContext=null,wakeLock=null;
const time=document.querySelector('#time'),toggle=document.querySelector('#toggle'),statusText=document.querySelector('#status'),message=document.querySelector('#message'),fill=document.querySelector('#fill'),track=document.querySelector('.track');
function render(){
 const seconds=Math.max(0,Math.ceil(remaining/1000));
 const minutes=Math.floor(seconds/60),rest=seconds%60;
 time.textContent=String(minutes).padStart(2,'0')+':'+String(rest).padStart(2,'0');
 time.setAttribute('aria-label',`남은 시간 ${minutes}분 ${rest}초`);
 time.classList.toggle('warn',seconds<=60&&seconds>10);time.classList.toggle('urgent',seconds<=10&&seconds>0);time.classList.toggle('done',finished);
 fill.style.width=(remaining/DURATION*100)+'%';track.setAttribute('aria-valuenow',seconds);track.setAttribute('aria-valuemax',DURATION/1000);
 document.querySelector('#duration-label').textContent=(DURATION/60000)+'분 · 함께 집중해요';
 document.title=time.textContent+' · 수업 타이머';
 toggle.textContent=running?'Ⅱ 일시정지':finished?'↻ 다시 시작':remaining<DURATION?'▶ 이어서 시작':'▶ 시작';
 statusText.textContent=finished?(DURATION/60000)+'분이 끝났어요!':running?'집중하고 있어요':remaining<DURATION?'잠시 쉬어 가요':'시작할 준비가 됐어요';
 message.textContent=finished?'수고했어요! 하던 활동을 마무리해 주세요.':running?(seconds<=10?'이제 10초도 남지 않았어요. 마무리해 주세요.':seconds<=60?'이제 1분도 남지 않았어요. 마무리해 볼까요?':'차근차근, 내 속도로 집중해 보세요.'):remaining<DURATION?'준비가 되면 이어서 시작해 주세요.':'준비가 되면 시작 버튼을 눌러 주세요.';
 document.body.classList.toggle('finish',finished);
}
async function prepareAudio(){try{if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')await audioContext.resume();return true;}catch{message.textContent='브라우저에서 소리를 재생할 수 없어요. 소리 설정을 확인해 주세요.';return false;}}
function chime(force=false){if((!force&&!document.querySelector('#sound').checked)||!audioContext)return;[0,.4,.8,1.6,2,2.4].forEach((delay,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),start=audioContext.currentTime+delay;o.type='sine';o.frequency.value=[659.25,783.99,1046.5][i%3];g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(.2,start+.025);g.gain.exponentialRampToValueAtTime(.001,start+.75);o.connect(g);g.connect(audioContext.destination);o.start(start);o.stop(start+.8);});}
async function keepAwake(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen');}catch{}}
function releaseAwake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}
function tick(){if(!running)return;remaining=Math.max(0,deadline-Date.now());if(remaining===0){running=false;finished=true;releaseAwake();chime();}render();}
function toggleTimer(){prepareAudio();if(running){tick();running=false;releaseAwake();}else{if(finished){remaining=DURATION;finished=false;}deadline=Date.now()+remaining;running=true;keepAwake();}render();}
function reset(){running=false;finished=false;remaining=DURATION;releaseAwake();render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen();}catch{message.textContent='브라우저 메뉴의 전체 화면 기능을 이용해 주세요.';}}
document.querySelectorAll('[data-minutes]').forEach(button=>button.addEventListener('click',()=>{DURATION=Number(button.dataset.minutes)*60000;document.querySelectorAll('[data-minutes]').forEach(item=>item.setAttribute('aria-pressed',item===button?'true':'false'));reset();}));
document.querySelector('#test-sound').addEventListener('click',async()=>{if(await prepareAudio())chime(true);});
toggle.addEventListener('click',toggleTimer);document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#fullscreen').addEventListener('click',fullscreen);
document.addEventListener('fullscreenchange',()=>{document.querySelector('#fullscreen').textContent=document.fullscreenElement?'⛶ 전체 화면 나가기':'⛶ 전체 화면';});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||['INPUT','BUTTON','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggleTimer();}else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='f')fullscreen();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running){tick();keepAwake();}});
setInterval(tick,100);render();
</script>
</body></html>
